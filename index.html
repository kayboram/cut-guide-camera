<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10100f" />
    <title>컷가이드 카메라</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="setup-screen" class="screen setup-screen">
      <header class="setup-header">
        <p class="eyebrow">사진 촬영 도우미</p>
        <h1>컷가이드 카메라</h1>
        <p>찍을 사진을 붙여넣고, 화면 위 가이드를 보며 한 컷씩 찍어요.</p>
      </header>

      <section class="panel">
        <div class="section-title">
          <div>
            <span class="step">1</span>
            <h2>컷 리스트</h2>
          </div>
          <button id="sample-button" class="text-button" type="button">올센느 8컷 불러오기</button>
        </div>
        <p class="help">한 줄에 한 컷씩 붙여넣으세요. 마크다운 표도 읽을 수 있어요.</p>
        <textarea id="cut-input" rows="9" placeholder="컷 1 | 택배 받은 그대로 / 4종 한 번에 | 밝은 자연광&#10;컷 2 | 파우치 앞면 확대 | 디자인이 보이게"></textarea>
        <button id="parse-button" class="secondary-button" type="button">목록 만들기</button>
        <p id="parse-message" class="message" aria-live="polite"></p>
      </section>

      <section id="cut-list-panel" class="panel hidden">
        <div class="section-title">
          <div>
            <span class="step">2</span>
            <h2>예시 사진</h2>
          </div>
          <span id="setup-progress" class="pill"></span>
        </div>
        <p class="help">있으면 앨범에서 골라 주세요. 나중에 카메라 위에 반투명하게 보여요.</p>
        <div id="setup-cut-list" class="setup-cut-list"></div>
        <button id="start-button" class="primary-button" type="button">촬영 시작</button>
      </section>

      <footer class="privacy-note">사진은 이 휴대폰 안에서만 처리되고 서버로 전송되지 않아요.</footer>
    </main>

    <main id="camera-screen" class="screen camera-screen hidden">
      <video id="camera-video" autoplay playsinline muted></video>
      <img id="guide-image" class="guide-image hidden" alt="선택한 예시 구도" />
      <div class="camera-shade camera-shade-top"></div>
      <div class="camera-shade camera-shade-bottom"></div>

      <header class="camera-header">
        <button id="back-button" class="round-button" type="button" aria-label="목록으로 돌아가기">‹</button>
        <div class="camera-title-wrap">
          <p id="camera-counter"></p>
          <h1 id="camera-cut-title"></h1>
          <p id="camera-tip"></p>
        </div>
        <button id="list-button" class="round-button" type="button" aria-label="컷 목록 열기">☰</button>
      </header>

      <section class="overlay-controls" aria-label="예시 사진 설정">
        <button id="overlay-toggle" class="control-button" type="button">겹침 켜기</button>
        <label>
          <span>투명도</span>
          <input id="opacity-slider" type="range" min="5" max="90" value="38" />
        </label>
      </section>

      <section class="camera-actions">
        <button id="previous-button" class="nav-button" type="button">이전</button>
        <button id="shutter-button" class="shutter-button" type="button" aria-label="사진 찍기">
          <span></span>
        </button>
        <button id="next-button" class="nav-button" type="button">다음</button>
      </section>

      <p id="camera-message" class="camera-message" aria-live="polite"></p>

      <aside id="cut-drawer" class="cut-drawer hidden" aria-label="전체 컷 목록">
        <div class="drawer-header">
          <div>
            <p class="eyebrow">전체 목록</p>
            <h2 id="drawer-progress"></h2>
          </div>
          <button id="close-drawer-button" class="round-button dark" type="button" aria-label="목록 닫기">×</button>
        </div>
        <div id="drawer-list" class="drawer-list"></div>
        <button id="edit-list-button" class="secondary-button" type="button">목록·예시 사진 고치기</button>
      </aside>

      <canvas id="capture-canvas" class="hidden"></canvas>
    </main>

    <script src="app.js"></script>
  </body>
</html>
